[package]
name = "edgeshell"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "edgeshell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.40.1"
windows = { version = "0.62.2", features = ["Media_Control", "Foundation", "Storage_Streams", "Win32_System_WinRT", "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Dwm", "Win32_System_Threading", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_Performance", "Win32_System_Wmi", "Win32_NetworkManagement_WiFi", "Win32_NetworkManagement_Ndis", "Win32_UI_Shell", "Win32_System_Power", "Win32_UI_Accessibility"] }
base64 = "0.23.1"
wmi = "0.14"
tauri-plugin-single-instance = "2.5.5"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "bmp"] }
rayon = "1.12.0"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Dependency (image, rayon, wmi, ...) dikompilasi dengan optimasi walau di mode dev.
# Tanpa ini, decode gambar di `tauri dev` sangat lambat. Compile pertama jadi lebih lama.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
